<!DOCTYPE html>
<html>
    <title>Password Reset</title>
<head>
    <style>
        body{
            background-color:cadetblue;
            background-image: url("Library-Login.jpg");
        }
        .page{
            height: 100vh; /*ViewPort*/
            display: flex;
            justify-content:center;
            align-items:center;
        }
        .forgot-box{
            background-color: rgba(82, 67, 78, 0.616);
            padding: 50px;
            width: 500px;
            display: flex;
            font-size: 30px;

            flex-direction:column;
            align-items: center;
            gap: 5px;
            font-family:fantasy;
            color:aquamarine
        }
        input{
                width: 180px;
                height: 25px;
                border: 2px solid #96909b52;
                border-radius: 5px;
                padding: 0 10px;
                font-size: 16px;
                background-color:rgb(196, 206, 206);
            }
      
    </style>
</head>
<div class = "page">

    <div class = "forgot-box">
<Body>
    <label for = "email">Enter your email</label><br>
    <input type ="email" id = "email" placeholder = "Enter your mail"><br>

    <label for = "OTP">Enter your OTP</label><br>
    <input type ="password" id = "OTP" placeholder = "Enter your OTP"><br>
    
    <form action = "Home.html">
        <input type = "submit" value = "Register">
    </form>
</Body>
</div>
</div>
</html>
